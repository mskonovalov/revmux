name: build

on:
  push:
    branches:
    tags:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
        id: go

      - name: build and test
        run: |
          go build -o /dev/null ./app
          go test -race -timeout=100s -covermode=atomic -coverprofile=${{ github.workspace }}/profile.cov_tmp ./...
          grep -v -E "_mock.go|/mocks/" ${{ github.workspace }}/profile.cov_tmp > ${{ github.workspace }}/profile.cov

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.12.2"

      - name: install goveralls
        run: go install github.com/mattn/goveralls@latest

      - name: submit coverage
        continue-on-error: true
        run: $(go env GOPATH)/bin/goveralls -service="github" -coverprofile=${{ github.workspace }}/profile.cov
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
